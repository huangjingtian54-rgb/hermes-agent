[project]
name = "hermes-agent"
version = "0.18.0"
description = "AI Agent CLI by Nous Research"
authors = [{name = "Nous Research"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "openai>=2.0.0",
    "requests>=2.31.0",
    "PyJWT>=2.8.0",
    "rich>=13.9.0",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.45",
    "loguru>=0.6.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/nousresearch/hermes-agent"
Documentation = "https://hermes-agent.nousresearch.com/docs"
Repository = "https://github.com/nousresearch/hermes-agent"

[project.scripts]
hermes = "hermes_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_agent"]

[tool.ruff]
target-version = "py39"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "A",
    "COM",
    "C4",
    "SIM",
    "ARG",
    "PTH",
]
ignore = [
    "B008",
    "COM818",
    "PTH123",
]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["hermes_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if typing.TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py39']
